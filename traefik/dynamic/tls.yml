# Default certificate served when no ACME cert exists (local dev / fallback).
# Generated by scripts/gen-local-cert.sh
tls:
  stores:
    default:
      defaultCertificate:
        certFile: /certs/local.crt
        keyFile: /certs/local.key
  options:
    default:
      minVersion: VersionTLS12
      sniStrict: false
